<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #eef6ff;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #0066cc;
            display: none;
        }

        .clear {
            background: #555;
        }

        .clear:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Percentage Calculator</h1>

        <label for="percentage">Percentage (%)</label>
        <input type="number" id="percentage" placeholder="e.g. 20">

        <label for="number">Number</label>
        <input type="number" id="number" placeholder="e.g. 500">

        <button onclick="calculatePercentage()">
            Calculate
        </button>

        <button class="clear" onclick="clearCalculator()">
            Clear
        </button>

        <div class="result" id="result"></div>

    </div>

    <script>
        function calculatePercentage() {

            let percentage = parseFloat(
                document.getElementById("percentage").value
            );

            let number = parseFloat(
                document.getElementById("number").value
            );

            let resultBox = document.getElementById("result");

            if (isNaN(percentage) || isNaN(number)) {
                resultBox.style.display = "block";
                resultBox.innerHTML = "Please enter both values.";
                return;
            }

            let result = (percentage / 100) * number;

            resultBox.style.display = "block";
            resultBox.innerHTML =
                percentage + "% of " + number + " = " + result;
        }

        function clearCalculator() {

            document.getElementById("percentage").value = "";
            document.getElementById("number").value = "";

            let resultBox = document.getElementById("result");

            resultBox.style.display = "none";
            resultBox.innerHTML = "";
        }
    </script>

</body>
</html>
